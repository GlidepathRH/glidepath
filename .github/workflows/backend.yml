name: Backend

on:
  push:
  pull_request:

jobs:
  check:
    if: github.repository == 'GlidepathRH/glidepath'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Build production image
        run: docker build --build-arg APP_COMMIT_SHA=${{ github.sha }} --tag glidepath-backend:ci .

  publish:
    needs: check
    if: github.repository == 'GlidepathRH/glidepath' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/glidepathrh/glidepath-backend:latest
            ghcr.io/glidepathrh/glidepath-backend:${{ github.sha }}

  deploy:
    needs: publish
    if: github.repository == 'GlidepathRH/glidepath' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 "$RENDER_DEPLOY_HOOK_URL" || echo "Render hook did not respond; deployment can be retried in Render."
