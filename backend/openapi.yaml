openapi: 3.1.0
info:
  title: GLIDY API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    API for GLIDY launches on Robinhood Chain. All endpoints except
    GET /health/ require the configured MASTER_API_KEY as a Bearer token.
servers:
  - url: https://glidepath-api-mym0.onrender.com
    description: Production
  - url: http://localhost:3001
    description: Local development
security:
  - MasterApiKey: []
tags:
  - name: System
    description: Health and dependency status.
  - name: Indexer
    description: Indexing progress for Robinhood Chain.
  - name: Launches
    description: Launch data and creator-authenticated token image uploads.
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Public process health
      security: []
      responses:
        '200':
          description: Process is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          description: Route not found.
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check database and Robinhood RPC readiness
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, chainId]
                properties:
                  status: { type: string, const: ready }
                  chainId: { type: integer, const: 4663 }
        '503':
          description: A dependency is unavailable, the chain is misconfigured, API authentication is unconfigured, or the PostgreSQL rate limiter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/indexer:
    get:
      tags: [Indexer]
      operationId: getIndexerStatus
      summary: Get current indexer state
      responses:
        '200':
          description: In-memory status of the most recent polling cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: API authentication is not configured or the PostgreSQL rate limiter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/launches:
    get:
      tags: [Launches]
      operationId: listLaunches
      summary: List recently indexed launches
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of launches to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Launches ordered newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LaunchSummary'
        '400':
          description: Invalid limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Launch index is unavailable, API authentication is unconfigured, or the PostgreSQL rate limiter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/launches/{tokenAddress}:
    parameters:
      - $ref: '#/components/parameters/TokenAddress'
    get:
      tags: [Launches]
      operationId: getLaunch
      summary: Get launch details, current hook taxes, and market cap
      responses:
        '200':
          description: Indexed launch data with hook taxes and pool price read live onchain.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/LaunchSummary'
                      - type: object
                        required: [chain_id, indexed_at, buy_tax_pips, sell_tax_pips, market_cap_quote_wei, market_cap_quote_symbol, market_cap_usd_raw, market_cap_usd_source]
                        properties:
                          chain_id: { type: integer }
                          indexed_at: { type: string, format: date-time }
                          buy_tax_pips:
                            type: integer
                            description: Current buy tax; 1,000,000 pips equals 100%.
                          sell_tax_pips:
                            type: integer
                            description: Current sell tax; 1,000,000 pips equals 100%.
                          market_cap_quote_wei:
                            type: [string, 'null']
                            description: Fully diluted market capitalization in quote currency base units, calculated from live PoolManager spot price and total supply. Null when the quote asset is unsupported or the pool is uninitialized.
                          market_cap_quote_symbol:
                            type: [string, 'null']
                            description: Quote currency symbol for market_cap_quote_wei; currently ETH for supported pools.
                          market_cap_usd_raw:
                            type: [string, 'null']
                            description: Fully diluted market capitalization in USDG base units (6 decimals), converted using the Robinhood Chain ETH/USDG Uniswap v4 pool spot price. USDG is treated as approximately one US dollar.
                          market_cap_usd_source:
                            type: [string, 'null']
                            enum: [USDG, null]
                            description: Onchain quote source for the USD estimate.
        '400':
          description: tokenAddress is not a valid EVM address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Launch not found in the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Launch data is unavailable, API authentication is unconfigured, or the PostgreSQL rate limiter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/launches/{tokenAddress}/image:
    parameters:
      - $ref: '#/components/parameters/TokenAddress'
    post:
      tags: [Launches]
      operationId: uploadLaunchTokenImage
      summary: Upload the creator's image for a launched token
      description: >-
        Accepts a PNG, JPEG, or WebP image up to 2 MiB. The creator signs a message
        binding the image SHA-256 digest to the chain, token, and successful factory
        launch transaction. Images are stored in Cloudinary. Each token can have one image.
      parameters:
        - name: X-Glidy-Creator
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Address' }
        - name: X-Glidy-Launch-Tx
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Bytes32' }
        - name: X-Glidy-Image-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Token image stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [image_url]
                    properties:
                      image_url: { type: string, format: uri }
        '400':
          description: Invalid image, address, transaction hash, or signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Signature, creator, token, and successful launch transaction do not match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This token already has an image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Image exceeds the upload limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported image format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Cloudinary upload failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Cloudinary is not configured or the rate limiter is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/launches/{tokenAddress}/events:
    parameters:
      - $ref: '#/components/parameters/TokenAddress'
    get:
      tags: [Launches]
      operationId: listLaunchEvents
      summary: List indexed launch and pool events
      description: Returns up to 200 matching events, newest first.
      responses:
        '200':
          description: Indexed events for the launch pool.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LaunchEvent'
        '400':
          description: tokenAddress is not a valid EVM address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Launch not found in the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Launch event index is unavailable, API authentication is unconfigured, or the PostgreSQL rate limiter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/launches/{tokenAddress}/chart:
    parameters:
      - $ref: '#/components/parameters/TokenAddress'
    get:
      tags: [Launches]
      operationId: getLaunchChart
      summary: Get OHLCV candles indexed from pool-manager swaps
      parameters:
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [5m, 1h, 4h, 1d]
            default: 5m
      responses:
        '200':
          description: Candles for the launch pool, including the initial onchain launch price.
          content:
            application/json:
              schema:
                type: object
                required: [data, interval, indexed_swaps]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [time, open, high, low, close, volume]
                      properties:
                        time: { type: integer, description: Unix timestamp in seconds, bucketed by interval. }
                        open: { type: number, description: ETH per token. }
                        high: { type: number }
                        low: { type: number }
                        close: { type: number }
                        volume: { type: number, description: ETH volume. }
                  interval: { type: string, enum: [5m, 1h, 4h, 1d] }
                  indexed_swaps: { type: integer }
        '400':
          description: Invalid token address or interval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Launch not found in the index.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Chart currently supports native ETH quote pools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Chart data is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    MasterApiKey:
      type: http
      scheme: bearer
      bearerFormat: MASTER_API_KEY
      description: Send the configured MASTER_API_KEY as an Authorization Bearer token.
  parameters:
    TokenAddress:
      name: tokenAddress
      in: path
      required: true
      description: ERC-20 launch token address.
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{40}$'
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: More than 10 failed authentication attempts or 120 authenticated API requests from this IP in 15 minutes.
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window expires.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, timestamp, version, commit]
      properties:
        status: { type: string, const: ok }
        timestamp: { type: string, format: date-time }
        version: { type: string, example: 0.1.0 }
        commit: { type: string, description: Full source commit SHA baked into the image, example: unknown }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    IndexerStatus:
      type: object
      required: [status, chainId, nextBlock, indexedThroughBlock, lastPollAt, lastError]
      properties:
        status:
          type: string
          enum: [starting, syncing, idle, error]
        chainId: { type: integer, example: 4663 }
        nextBlock: { type: [string, 'null'] }
        indexedThroughBlock: { type: [string, 'null'] }
        lastPollAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'], description: Error class name only; null when the last poll succeeded. }
    LaunchSummary:
      type: object
      properties:
        token_address: { $ref: '#/components/schemas/Address' }
        pool_id: { $ref: '#/components/schemas/Bytes32' }
        creator_address: { $ref: '#/components/schemas/Address' }
        quote_currency: { $ref: '#/components/schemas/Address' }
        token_name: { type: string }
        token_symbol: { type: string }
        token_decimals: { type: integer }
        total_supply: { $ref: '#/components/schemas/DecimalString' }
        liquidity_token_amount: { $ref: '#/components/schemas/DecimalString' }
        liquidity_quote_amount: { $ref: '#/components/schemas/DecimalString' }
        creator_first_buy_token_amount: { $ref: '#/components/schemas/DecimalString' }
        creator_first_buy_quote_amount: { $ref: '#/components/schemas/DecimalString' }
        sqrt_price_x96: { $ref: '#/components/schemas/DecimalString' }
        trading_opens_at: { $ref: '#/components/schemas/DecimalString' }
        buy_path: { $ref: '#/components/schemas/TaxPath' }
        sell_path: { $ref: '#/components/schemas/TaxPath' }
        creator_buy_ceiling_pips: { type: integer }
        creator_sell_ceiling_pips: { type: integer }
        snipe_config: { type: object, additionalProperties: true }
        snipe_ended: { type: boolean }
        payout_recipients:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        payout_weights_bps:
          type: array
          items: { type: integer }
        launch_block_number: { $ref: '#/components/schemas/DecimalString' }
        launch_block_timestamp: { $ref: '#/components/schemas/DecimalString' }
        launch_transaction_hash: { $ref: '#/components/schemas/Bytes32' }
        launch_log_index: { type: integer }
        image_url: { type: [string, 'null'], format: uri, description: Optional creator-uploaded token image stored in Cloudinary. }
        buy_tax_pips: { type: [integer, 'null'], description: Current buy tax read live from the hook; 1,000,000 pips equals 100%. }
        sell_tax_pips: { type: [integer, 'null'], description: Current sell tax read live from the hook; 1,000,000 pips equals 100%. }
        market_cap_quote_wei: { type: [string, 'null'], description: Fully diluted market cap in the launch quote currency base units, from live PoolManager spot price and total supply. }
        market_cap_quote_symbol: { type: [string, 'null'], description: Quote currency symbol for market_cap_quote_wei; currently ETH for supported launches. }
        market_cap_usd_raw: { type: [string, 'null'], description: Fully diluted market cap in USDG base units, converted from the onchain ETH/USDG pool spot price and treating USDG as approximately one US dollar. }
        market_cap_usd_source: { type: [string, 'null'], enum: [USDG, null], description: Onchain quote source for the USD estimate. }
    TaxPath:
      type: object
      properties:
        startPips: { $ref: '#/components/schemas/IntegerLike' }
        floorPips: { $ref: '#/components/schemas/IntegerLike' }
        stepPips: { $ref: '#/components/schemas/IntegerLike' }
        holdSeconds: { $ref: '#/components/schemas/IntegerLike' }
        stepIntervalSeconds: { $ref: '#/components/schemas/IntegerLike' }
      additionalProperties: true
    LaunchEvent:
      type: object
      properties:
        event_name: { type: string }
        args: { type: object, additionalProperties: true }
        block_number: { $ref: '#/components/schemas/DecimalString' }
        block_timestamp: { $ref: '#/components/schemas/DecimalString' }
        transaction_hash: { $ref: '#/components/schemas/Bytes32' }
        log_index: { type: integer }
        contract_address: { $ref: '#/components/schemas/Address' }
    Address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
    Bytes32:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
    DecimalString:
      type: string
      pattern: '^[0-9]+$'
      description: Decimal integer string preserving full EVM integer precision.
    IntegerLike:
      oneOf:
        - type: integer
        - $ref: '#/components/schemas/DecimalString'
